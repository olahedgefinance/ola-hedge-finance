<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ÓLA HEDGE FINANCE">
  <link rel="apple-touch-icon" href="branding/dev/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="branding/dev/favicon.png"/>
  <link rel="icon" type="image/x-icon" href="branding/dev/favicon.ico"/>

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0B1220">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0B1220">

  <title>ÓLA HEDGE FINANCE</title>
  <link rel="manifest" href="branding/dev/manifest.json">

  <meta name="title" content="ÓLA HEDGE FINANCE" />
  <meta name="description" content="A budget and financial tracking application designed for you" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="ÓLA HEDGE FINANCE" />
  <meta property="og:description" content="A budget and financial tracking application designed for you" />
  <meta property="og:image" content="branding/dev/Icon-512.png" />

  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="ÓLA HEDGE FINANCE" />
  <meta property="twitter:description" content="A budget and financial tracking application designed for you" />
  <meta property="twitter:image" content="branding/dev/Icon-512.png" />

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body oncontextmenu="return false;">
  <style>
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0B1220;
      }
    }
  </style>
  <script defer src="sql-wasm.js"></script>
  <div id="loading">
    <style>
      body {
        background-color: #0B1220;
        color: #F8FAFC;
        inset: 0;
        overflow: hidden;
        margin: 0;
        padding: 0;
        position: fixed;
      }

      #loading {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        width: 100%;
      }

      #loading .loading-spinner, #loading .loading-icon {
        transition: opacity 0.5s;
      }

      #loading.main_done .loading-spinner {
        opacity: 0;
      }

      #loading.init_done .loading-spinner, #loading.init_done .loading-icon {
        /* animation: .33s ease-in-out 0s 1 forwards zoom; */
        opacity: 0;
      }

      .loading-spinner {
        margin: 40px 10px;
        display: inline-block;
        width: 45px;
        height: 45px;
        border: 4px solid rgba(255,255,255,.3);
        border-radius: 50%;
        border-top-color: #e3e7ff;
        animation: spin 1s linear infinite;
        opacity: .66;
      }

      .column{
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .loading-icon{
        margin: 40px 10px;
        width: min(30vh, 30vw);
        height: min(30vh, 30vw);
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="column">
      <img src="./branding/dev/Icon.png" class="loading-icon" alt="ÓLA HEDGE — temporary development icon"/>
      <p>ÓLA HEDGE FINANCE · Internal development</p>
      <div class="loading-spinner"></div>
    </div>
  </div>
  <script>
    window.addEventListener('load', function(ev) {
      var loading = document.querySelector('#loading');
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        }
      }).then(function(engineInitializer) {
        loading.classList.add('main_done');
        return engineInitializer.initializeEngine({
          useColorEmoji: true,
        });
      }).then(function(appRunner) {
        loading.classList.add('init_done');
        return appRunner.runApp();
      }).then(function (_) {
        // Wait a few milliseconds so users can see the "zoom" animation
        // before getting rid of the "loading" div.
        window.setTimeout(function () {
          loading.remove();
        }, 200);

        // https://github.com/flutter/flutter/issues/55913#issuecomment-1248816491
        
        const flutterRoot = document.getElementsByTagName('flt-glass-pane').item(0);
        flutterRoot.addEventListener('touchstart', (e) => {
          // is not near edge of view, exit
          if (e.pageX > 24 && e.pageX < window.innerWidth - 24) return;
          // prevent swipe to navigate gesture
          e.preventDefault();
        });
      });
    });
  </script>
</body>
</html>
